<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hoops Planner</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <script>
      /* Apply the saved theme before first paint so the app never flashes
         the wrong mode while the JS bundle downloads. Mirrors the
         resolution logic in src/theme/useTheme.ts — keep them in sync. */
      (function () {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <style>
    /* Boot splash: static markup shown while the JS bundle downloads,
       fades out when main.tsx runs (adds .js-ready to <html>). */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      background: #111111;
      transition: opacity 0.45s ease, visibility 0.45s;
    }
    html.js-ready #splash {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-stage {
      position: relative;
    }
    .splash-ball {
      width: 150px;
      height: 150px;
      display: block;
      transform-origin: bottom center;
      filter: drop-shadow(0 8px 18px rgba(234, 88, 12, 0.28));
      animation: splash-bounce 1.6s cubic-bezier(0.36, 0, 0.64, 1) infinite;
    }
    /* Ground shadow stays fixed on the "floor" while the ball bounces above
       it. It shrinks and fades as the ball rises, grows and darkens as it
       lands — synced to the same 1.6s timeline as the bounce. */
    .splash-shadow {
      position: absolute;
      bottom: -16px;
      left: 50%;
      width: 132px;
      height: 24px;
      margin-left: -66px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0) 70%);
      animation: splash-shadow 1.6s cubic-bezier(0.36, 0, 0.64, 1) infinite;
    }
    /* Squash-and-stretch: maximum compression happens exactly at the moment of
       floor contact (0%/100%), then the ball springs back to normal shape and
       travels through the air. Keyframe spacing keeps the ball fast near the
       floor and slow near the apex, mimicking gravity. */
    @keyframes splash-bounce {
      0%   { transform: translateY(0)     scale(1.22, 0.78); }
      10%  { transform: translateY(-10px) scale(0.97, 1.03); }
      22%  { transform: translateY(-26px) scale(1, 1); }
      50%  { transform: translateY(-42px) scale(1, 1); }
      78%  { transform: translateY(-26px) scale(1, 1); }
      90%  { transform: translateY(-10px) scale(1.02, 0.98); }
      100% { transform: translateY(0)     scale(1.22, 0.78); }
    }
    @keyframes splash-shadow {
      0%   { transform: scaleX(1);    opacity: 0.5; }
      10%  { transform: scaleX(0.82); opacity: 0.38; }
      22%  { transform: scaleX(0.68); opacity: 0.28; }
      50%  { transform: scaleX(0.5);  opacity: 0.16; }
      78%  { transform: scaleX(0.68); opacity: 0.28; }
      90%  { transform: scaleX(0.82); opacity: 0.38; }
      100% { transform: scaleX(1);    opacity: 0.5; }
    }
    .splash-name {
      display: flex;
      align-items: baseline;
      gap: 8px;
      color: #ffffff;
      font-family: "Lato", "DejaVu Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
      font-weight: 900;
      font-size: 26px;
      letter-spacing: 3px;
    }
    .splash-name em {
      font-style: normal;
      color: #ea580c;
      font-size: 19px;
      letter-spacing: 5px;
    }
    .splash-bar {
      width: 150px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }
    .splash-bar span {
      display: block;
      height: 100%;
      border-radius: 2px;
      background: #f97316;
      animation: splash-load 1.6s ease-in-out infinite;
    }
    @keyframes splash-load {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <div class="splash-stage">
      <div class="splash-shadow"></div>
      <svg class="splash-ball" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="ballGradSplash" cx="38%" cy="32%" r="78%">
            <stop offset="0%" stop-color="#fdba74"/>
            <stop offset="45%" stop-color="#f97316"/>
            <stop offset="100%" stop-color="#ea580c"/>
          </radialGradient>
          <clipPath id="ballClipSplash">
            <circle cx="512" cy="512" r="455"/>
          </clipPath>
        </defs>
        <g transform="rotate(-14 512 512)">
          <circle cx="512" cy="512" r="480" fill="url(#ballGradSplash)"/>
          <g clip-path="url(#ballClipSplash)" fill="none" stroke="#111111" stroke-width="30" stroke-linecap="round">
            <line x1="512" y1="32" x2="512" y2="992"/>
            <line x1="32" y1="512" x2="992" y2="512"/>
            <path d="M 170 172 Q 393 512 170 852"/>
            <path d="M 854 172 Q 631 512 854 852"/>
          </g>
          <circle cx="512" cy="512" r="480" fill="none" stroke="#111111" stroke-width="34"/>
        </g>
      </svg>
      </div>
      <div class="splash-name">HOOPS <em>PLANNER</em></div>
      <div class="splash-bar"><span></span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
