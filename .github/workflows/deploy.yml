name: Deploy

on:
  push:
    branches: [main]

# Only one deploy at a time; skip if one is already running
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [hoops-server]
    steps:
      - name: Pull & redeploy
        working-directory: /mnt/user/appdata/hoops-planner
        run: |
          git pull
          docker compose up -d --build
