[project]
name = "sixth-man"
version = "0.1.0"
description = "Planning app for basketball club tasks."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "python-dotenv>=1.0",
    "reportlab>=5.0.0",
    "weasyprint>=69.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
    "ty>=0.0.44",
    "pytest>=8.0",
    "pytest-django>=4.9",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.format]
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]

[tool.ty.rules]
all = "error"
unresolved-attribute = "ignore"
missing-override-decorator = "ignore"
invalid-return-type = "ignore"
invalid-argument-type = "ignore"
unsupported-operator = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "sixth_man.settings"

[tool.django]
settings = "sixth_man.settings"
