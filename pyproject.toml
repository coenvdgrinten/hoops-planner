[project]
name = "sixth-man"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "ruff>=0.15.16",
    "ty>=0.0.44",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ty.rules]
all = "error"
unresolved-attribute = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
