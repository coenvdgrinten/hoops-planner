name: hoops-planner

services:
  backend:
    build: .
    ports:
      - "8001:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - PYTHONPATH=/app/src
      - DB_PATH=/data/db.sqlite3
      - SITE_URL=${SITE_URL:-http://localhost:5173}
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-hoops-planner@localhost}
    volumes:
      - ./src:/app/src          # Mount source for hot-reload
      - ./tests:/app/tests      # Mount tests
      - db-data:/data           # Persist SQLite DB
      - media-data:/app/media   # Persist uploaded files

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    volumes:
      - ./frontend/src:/app/src  # Mount source for hot-reload
    depends_on:
      - backend

volumes:
  db-data:
  media-data:
