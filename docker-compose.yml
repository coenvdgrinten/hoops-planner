name: hoops-planner

services:
  backend:
    build: .
    ports:
      - "8001:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - PYTHONPATH=/app/src
      - DB_PATH=/data/db.sqlite3
      - SITE_URL=${SITE_URL:-http://localhost:5173}
    volumes:
      - ./src:/app/src          # Mount source for hot-reload
      - db-data:/data           # Persist SQLite DB
      - media-data:/app/media   # Persist uploaded files

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://backend:8000}
    volumes:
      - ./frontend/src:/app/src  # Mount source for hot-reload
    depends_on:
      - backend

volumes:
  db-data:
  media-data:
